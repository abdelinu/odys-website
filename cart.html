<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your journey — Cart &amp; checkout</title>
<meta name="description" content="Your ODYS bag, the points it earns, the rewards it spends, and a checkout that stays out of the way.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<!-- outside Arabic the page needs Amiri for one decorative line, so only those letters are fetched (35 KB, not 125 KB). i18n.js pulls the full face when the reader switches to Arabic. -->
<link href="https://fonts.googleapis.com/css2?family=Amiri&text=%D8%A1%D8%A3%D8%A6%D8%A7%D8%A8%D8%A9%D8%AA%D8%AC%D8%AD%D8%AE%D8%AF%D8%B0%D8%B1%D8%B2%D8%B3%D8%B4%D8%B5%D8%B6%D8%B7%D8%B8%D8%B9%D9%81%D9%82%D9%83%D9%84%D9%85%D9%86%D9%87%D9%88%D9%89%D9%8A%D9%91%C2%B7&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/odys.css?v=20261011b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%233D1216'/%3E%3Ctext x='16' y='22' font-family='serif' font-size='16' fill='%23B08D4F' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="odys-chrome"></div>
<main id="main"><div id="view"></div></main>
<div id="odys-footer"></div>

<script src="assets/js/i18n.js?v=20261011b"></script>
<script src="assets/js/i18n-content.js?v=20261011b"></script>
<script src="assets/js/i18n-labels.js?v=20261011b"></script>
<script src="assets/js/data.js?v=20261011b"></script>
<script>
window.PAGE = function (OD) {
  const { D, C, $, $$, card, bottle, money, num, esc, S, save, find, T } = OD;
  let useRewards = true, done = false;

  function totals() {
    const s = S(), sub = OD.subtotal();
    const r = useRewards ? OD.rewardDiscount(s.cart, s.vouchers || []) : { discount: 0, used: [] };
    // a redeemed reward always ships free — charging 35 MAD on a "free" perfume reads badly
    const ship = (sub - r.discount) >= C.freeShipFrom || !sub || r.discount ? 0 : 35;
    return { sub, ship, disc: r.discount, used: r.used, total: Math.max(0, sub - r.discount) + ship, earn: OD.cartPointsAwarded() };
  }

  function render() {
    const s = S(), t = totals();
    if (!s.cart.length) {
      $('#view').innerHTML = `<section class="section center"><div class="wrap" style="max-width:560px">
        <p class="eyebrow">Your journey</p>
        <h1 class="d2" style="margin-bottom:12px">The bag is empty.</h1>
        <p class="lede" style="margin:0 auto 26px">${T('A 50 ML parfum is')} ${money(C.prices.perfume50)} ${T('and one point. Twenty points is the next one free.')}</p>
        <a class="btn" href="shop.html">Discover parfums</a>
        <a class="btn btn-ghost" href="coffrets.html" style="margin-left:10px">Build a coffret</a>
      </div></section>`;
      return;
    }

    $('#view').innerHTML = `
      <section class="section-sm">
        <div class="wrap-wide">
          <p class="eyebrow">Your journey</p>
          <h1 class="d2">${OD.cartCount()} chapter${OD.cartCount() > 1 ? 's' : ''} in the bag.</h1>
          <div class="split split-main" style="align-items:start;margin-top:34px">
            <div>
              ${s.cart.map(l => `<div class="li" style="grid-template-columns:96px 1fr auto">
                  <div class="thumb" style="--c1:${l.c[0]};--c2:${l.c[1]}">${bottle(find(l.id) || { c: l.c, code: l.code, type: l.kind }, { k: 'c' })}</div>
                  <div>
                    <p class="card-code">${esc(l.code || 'COFFRET')}</p>
                    <h3 style="font-family:var(--display);font-size:23px;margin:4px 0">${esc(l.title)}</h3>
                    <p class="card-meta">${esc(l.sub)}</p>
                    ${l.meta ? `<p class="muted" style="font-size:12.5px;margin:6px 0 0">${esc(l.meta.items.map(i => { const x = find(i.id); return x.name + (i.grams ? ' ' + i.grams + 'g' : ''); }).join(' · '))}
                      · écrin ${esc(l.meta.custom.box)}${l.meta.custom.engraving ? ' · gravé « ' + esc(l.meta.custom.engraving) + ' »' : ''}${l.meta.gift ? ' · pour ' + esc(l.meta.gift.name) : ''}</p>` : ''}
                    <div class="qty" style="margin-top:10px">
                      <button data-qty="${l.key}" data-d="-1" aria-label="Decrease">−</button><span>${l.qty}</span>
                      <button data-qty="${l.key}" data-d="1" aria-label="Increase">+</button>
                    </div>
                  </div>
                  <div style="text-align:right">
                    <p class="price">${money(l.unit * l.qty)}</p>
                    <p class="mono" style="color:${l.points ? 'var(--accent)' : 'var(--ink-soft)'}">${l.points ? '+' + OD.ptsLabel(l.points * l.qty) + ' ' + OD.ptsWord(l.points * l.qty) : T('no points')}</p>
                  </div>
                </div>`).join('')}

              <div class="box" style="margin-top:26px">
                <p class="eyebrow">Complete your journey</p>
                <div class="grid grid-3" style="margin-top:10px">${D.parfums.filter(p => !s.cart.some(l => l.id === p.id)).slice(0, 3).map(p => card(p)).join('')}</div>
              </div>
            </div>

            <aside class="box" style="position:sticky;top:100px">
              <p class="eyebrow">Summary</p>
              ${[['Subtotal', money(t.sub)], t.disc ? ['Rewards applied', '− ' + money(t.disc)] : null,
      ['Shipping', t.ship ? money(t.ship) : 'Free']]
        .filter(Boolean).map(r => `<div style="display:flex;justify-content:space-between;font-size:14px;padding:9px 0">
          <span class="muted">${r[0]}</span><b>${r[1]}</b></div>`).join('')}
              <hr class="rule" style="margin:10px 0">
              <div style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0">
                <span class="mono">Total</span><b class="d3" style="font-size:28px">${money(t.total)}</b>
              </div>

              ${(s.vouchers || []).length ? `
              <div style="border:1px solid var(--accent);padding:16px;margin:16px 0">
                <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
                  <input type="checkbox" id="userw" ${useRewards ? 'checked' : ''} style="margin-top:4px">
                  <span>
                    <b class="mono" style="color:var(--accent)">Use my rewards</b>
                    <span class="muted" style="display:block;font-size:13px;margin-top:4px">
                      ${s.vouchers.map(v => v.name).join(' · ')}${t.used.length ? '<br>' + T('Applied:') + ' ' + t.used.map(u => T(u.label)).join(', ') : '<br>' + T('Add an eligible item to use it')}
                    </span>
                  </span>
                </label>
              </div>` : `<p class="mono muted" style="margin:16px 0">${C.rewards[0].pts} ${T('points = your first reward')} · ${T('You have')} ${num(s.points)}</p>`}

              ${(() => {
        const after = s.points + t.earn, nxt = OD.nextReward(after);
        return `<div class="bar"><i style="width:${Math.min(100, after / (nxt ? nxt.pts : after || 1) * 100)}%"></i></div>
                <div class="bar-labels" style="margin-bottom:18px">
                  <span>${T("You'll earn")} ${t.earn} ${OD.ptsWord(t.earn)}</span>
                  <span>${nxt ? (nxt.pts - after) + ' → ' + OD.T(nxt.name) : OD.T('All rewards unlocked')}</span>
                </div>`;
      })()}

              <a class="btn btn-wa btn-block" id="waorder" href="${OD.waLink()}" target="_blank" rel="noopener">Order on WhatsApp</a>
              <button class="btn btn-ghost btn-block" id="checkout" style="margin-top:10px">Or leave your address here</button>
              <p class="muted" style="font-size:12px;margin:12px 0 0">Cash on delivery · 24–72h across Morocco · we confirm every order by message before shipping</p>
            </aside>
          </div>
        </div>
      </section>

      <section class="section" style="background:var(--bg-alt);display:none" id="checkoutstep">
        <div class="wrap" style="max-width:820px">
          <p class="eyebrow">Checkout</p>
          <h2 class="d2" style="margin-bottom:24px">Where does it go?</h2>
          <form class="box" id="cform">
            <div class="grid grid-2 grid-1-sm" style="gap:0 20px">
              <label class="field"><span>First name</span><input name="fn" required></label>
              <label class="field"><span>Last name</span><input name="ln" required></label>
            </div>
            <label class="field"><span>Phone</span><input name="tel" required placeholder="06 00 00 00 00"></label>
            <label class="field"><span>Address</span><input name="addr" required></label>
            <div class="grid grid-2 grid-1-sm" style="gap:0 20px">
              <label class="field"><span>City</span><input name="city" required></label>
              <label class="field"><span>Payment</span><select name="pay"><option>Cash on delivery</option><option>Bank transfer</option></select></label>
            </div>
            ${s.cart.some(l => l.meta && l.meta.gift) ? `<p class="mono" style="color:var(--accent)">A coffret in this order ships straight to its recipient — that address is already saved.</p>` : ''}
            <button class="btn btn-wa btn-block" type="submit" style="margin-top:10px">Send order on WhatsApp · ${money(t.total)}</button>
            <p class="muted" style="font-size:12px;margin:12px 0 0">Opens WhatsApp with your basket and address already written. Nothing is charged online.</p>
          </form>
        </div>
      </section>`;

    const rw = $('#userw');
    if (rw) rw.addEventListener('change', e => { useRewards = e.target.checked; render(); });
    $('#checkout').addEventListener('click', () => {
      const step = $('#checkoutstep');
      step.style.display = 'block';
      step.scrollIntoView({ behavior: 'smooth' });
    });
    $('#cform').addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const s2 = S(), t2 = totals();
      // the order leaves as a WhatsApp message — that is the backend for now
      window.open(OD.waLink({
        name: (f.get('fn') || '') + ' ' + (f.get('ln') || '') + ' · ' + (f.get('tel') || ''),
        addr: f.get('addr'), city: f.get('city')
      }), '_blank', 'noopener');
      const order = {
        ref: 'ODY-' + Date.now().toString(36).toUpperCase().slice(-6),
        at: Date.now(), items: s2.cart.slice(), total: t2.total, points: t2.earn,
        status: 'Preparing', rewards: t2.used.map(u => u.label)
      };
      if (useRewards && t2.used.length) {
        const spent = t2.used.map(u => u.v);
        s2.vouchers = (s2.vouchers || []).filter(v => spent.indexOf(v) === -1);
      }
      s2.orders.unshift(order);
      s2.cart = [];
      save();
      OD.award(t2.earn, 'Order ' + order.ref);
      confirmed(order);
    });

    OD.paint();
  }

  function confirmed(o) {
    done = true;
    const s = S(), nxt = OD.nextReward(s.points);
    $('#view').innerHTML = `<section class="section center">
      <div class="wrap" style="max-width:620px">
        <p class="eyebrow">Chapter added</p>
        <h1 class="d2" style="margin-bottom:12px">Thank you.</h1>
        <p class="lede" style="margin:0 auto 26px">Order ${o.ref} is being prepared in Casablanca${o.rewards.length ? ' — ' + o.rewards.join(' and ') + ' applied' : ''}. You earned ${num(o.points)} point${o.points === 1 ? '' : 's'}.</p>
        <div class="pts-hero" style="text-align:left">
          <div class="pts-big">${num(s.points)}</div>
          <p class="mono muted">ODYS points</p>
          <div class="bar"><i style="width:${Math.min(100, s.points / (nxt ? nxt.pts : s.points || 1) * 100)}%"></i></div>
          <div class="bar-labels"><span>${nxt ? num(nxt.pts - s.points) + ' → ' + OD.T(nxt.name) : OD.T('Everything unlocked')}</span><span>${nxt ? num(nxt.pts) : ''}</span></div>
          <a class="btn btn-block" href="rewards.html" style="margin-top:18px">${nxt ? 'Keep going' : 'Redeem your reward'}</a>
        </div>
        <p style="margin-top:24px"><a class="link-u" href="account.html#myorders">Track this order</a></p>
      </div></section>`;
    OD.observe();
  }

  render();
  document.addEventListener('odys:state', () => { if (!done && !$('#cform')) render(); });
};
</script>
<script src="assets/js/app.js?v=20261011b"></script>
</body>
</html>
