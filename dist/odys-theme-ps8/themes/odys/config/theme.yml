name: odys
display_name: "ODYS Parfums Theme"
version: "5.0.0"
parent: classic
author:
  name: "ODYS Parfums"
  email: "contact@odys.ma"
  url: "https://odys.ma"
meta:
  compatibility:
    from: "8.0.0"
    to: "9.1.99"
  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns.
    layout-both-columns:
      name: Three Columns
      description: One central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column.
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column.
  modules:
    to_enable:
      - ps_shoppingcart
      - ps_searchbar
      - ps_mainmenu
      - ps_featuredproducts
      - ps_emailsubscription
      - ps_imageslider
      - ps_socialfollow
      - ps_cashondelivery
      - ps_wirepayment
      - blockwishlist
      - odys_loyalty
    to_disable:
      - ps_themecusto
assets:
  use_parent_assets: false
  css:
    all:
      - id: theme-style
        path: assets/css/theme.css
        media: all
  js:
    all:
      - id: theme-app
        path: assets/js/app.js
        position: bottom
        priority: 1
global_settings:
  image_types:
    cart_default:
      width: 125
      height: 125
      scope: [ products ]
    small_default:
      width: 98
      height: 98
      scope: [ products, categories, manufacturers, suppliers ]
    medium_default:
      width: 452
      height: 452
      scope: [ products, manufacturers, suppliers ]
    home_default:
      width: 400
      height: 400
      scope: [ products ]
    large_default:
      width: 800
      height: 800
      scope: [ products, manufacturers, suppliers ]
    category_default:
      width: 960
      height: 400
      scope: [ categories ]
    stores_default:
      width: 170
      height: 115
      scope: [ stores ]

theme_settings:
  default_layout: layout-full-width
  layouts:
    category: layout-full-width
    best-sales: layout-full-width
    new-products: layout-full-width
    prices-drop: layout-full-width
    contact: layout-full-width
