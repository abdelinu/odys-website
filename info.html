<body>
<div id="odys-chrome"></div>

<!--
  ⚠ BEFORE LAUNCH
  - Returns: the 7-day window follows the distance-selling withdrawal right in law 31-08; have it reviewed.
  - Privacy: declare the processing of customer data to the CNDP (law 09-08) before collecting real orders.
  - Terms (CGV), delivery times, refund delay, email and opening hours are templates to confirm.
-->

<main id="main">
  <section class="section-sm">
    <div class="wrap">
      <p class="eyebrow">Help &amp; policies</p>
      <h1 class="d2">Everything before you order.</h1>
      <p class="lede" style="margin-top:14px">Delivery, returns, payment and the small print — in plain words. If something isn't here, ask us on WhatsApp.</p>
      <nav class="pills" style="margin-top:26px" aria-label="Sections">
        <a class="pill" href="#delivery">Delivery</a>
        <a class="pill" href="#returns">Returns</a>
        <a class="pill" href="#payment">Payment</a>
        <a class="pill" href="#faq">FAQ</a>
        <a class="pill" href="#contact">Contact</a>
        <a class="pill" href="#privacy">Privacy</a>
        <a class="pill" href="#terms">Terms</a>
      </nav>
    </div>
  </section>

  <div class="wrap" style="padding-bottom:clamp(56px,9vw,120px)" id="info"></div>
</main>

<div id="odys-footer"></div>

<script src="assets/js/i18n.js?v=20261011a"></script>
<script src="assets/js/i18n-content.js?v=20261011a"></script>
<script src="assets/js/i18n-labels.js?v=20261011a"></script>
<script src="assets/js/data.js?v=20261011a"></script>
<script>
window.PAGE = function (OD) {
  const { C, $, money, T } = OD;
  const block = (id, title, lines) => `
    <section id="${id}" class="note-tier in info-row">
      <b>${T(title)}</b>
      <div>${lines.map(l => `<p style="margin:0 0 12px">${l}</p>`).join('')}</div>
    </section>`;

  const faq = [
    ['How long does a 50 ML bottle last?', 'About 500 sprays — three to four months of daily wear.'],
    ['How long does a stick of oud burn?', 'Around thirty minutes once the flame is blown out. The oud page shows the full ritual.'],
    ['Can I change or cancel my order?', 'Yes, until we confirm it by message — just reply to that message.'],
    ['Can I send a coffret as a gift?', 'Yes. Choose "It\'s a gift" first in the builder, and we deliver to the recipient with prices hidden.'],
    ['Do diffuseurs earn points?', 'No. They are already priced at the floor.'],
    ['Where are you based?', 'Casablanca. We deliver across Morocco.']
  ];

  $('#info').innerHTML = [
    block('delivery', 'Delivery', [
      T('Across Morocco in 24–72h. Casablanca is usually next day.'),
      T('Free delivery from') + ' ' + money(C.freeShipFrom) + '. ' + T('Below that, a flat') + ' ' + money(35) + '.',
      T('We confirm every order by WhatsApp message before it leaves Casablanca. If we cannot reach you, we do not ship.'),
      T('Gift coffrets can go straight to the recipient, with prices hidden.')
    ]),
    block('returns', 'Returns', [
      T('You have 7 days from delivery to return an unopened product.'),
      T('Opened fragrances and burned oud cannot be returned — unless they arrived damaged or not as described.'),
      T('Something broken in transit? Send us a photo on WhatsApp within 48 hours and we replace it free.'),
      T('Refunds are made within 14 days of us receiving the item.')
    ]),
    block('payment', 'Payment', [
      T('Cash on delivery, everywhere we ship. Bank transfer on request.'),
      T('Nothing is charged online.'),
      T('Prices are in MAD, taxes included.')
    ]),
    `<section id="faq" class="note-tier in info-row">
      <b>${T('FAQ')}</b>
      <div>${faq.map(f => `<details style="padding:10px 0;border-bottom:1px solid var(--line)">
        <summary style="cursor:pointer;font-family:var(--display);font-size:20px">${T(f[0])}</summary>
        <p class="muted" style="margin:8px 0 0">${T(f[1])}</p></details>`).join('')}
        <p style="margin:16px 0 0"><a class="link-u" href="rewards.html#ladder">${T('How points work')}</a></p>
      </div>
    </section>`,
    block('contact', 'Contact', [
      `<a class="btn btn-wa" href="${OD.waHref(T('Hello ODYS, I have a question'))}" target="_blank" rel="noopener">WhatsApp +${C.whatsapp}</a>`,
      T('Monday to Saturday, 10:00–19:00.'),
      'contact@odysparfum.ma · Casablanca'
    ]),
    block('privacy', 'Privacy', [
      T('We only ask for what a delivery needs: your name, phone number and address.'),
      T('We use it to confirm and deliver your order and to keep your points. We never sell it.'),
      T('Ask us on WhatsApp and we delete it.')
    ]),
    block('terms', 'Terms', [
      T('Prices can change. The price confirmed in our WhatsApp message is the price you pay.'),
      T('An order is final once we confirm it by message and you accept.'),
      T('Points and rewards have no cash value and are withdrawn if the order that earned them is returned.'),
      T('Oud orders above') + ' ' + C.oud.specialFrom + ' g ' + T('are quoted individually and confirmed before shipping.')
    ])
  ].join('');

  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
};
</script>
<script src="assets/js/app.js?v=20261011a"></script>
</body>
</html>
