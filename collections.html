<body>
<div id="odys-chrome"></div>

<main id="main">
  <section class="section-sm">
    <div class="wrap-wide">
      <p class="eyebrow">The ODYS collections</p>
      <h1 class="d2">Six chapters,<br>one journey.</h1>
      <p class="lede" style="margin-top:16px">Each collection is a different reason to wear something. Start where your life actually is.</p>
    </div>
  </section>

  <div id="cols"></div>
</main>

<div id="odys-footer"></div>

<script src="assets/js/i18n.js?v=20261012e"></script>
<script src="assets/js/i18n-content.js?v=20261012e"></script>
<script src="assets/js/i18n-labels.js?v=20261012e"></script>
<script src="assets/js/data.js?v=20261012e"></script>
<script>
window.PAGE = function (OD) {
  const { D, $, card } = OD;
  const pool = D.products;

  $('#cols').innerHTML = D.collections.map((c, i) => {
    // the gift edit is coffrets, not single products
    const items = c.id === 'gifts' ? D.coffrets : pool.filter(p => (p.tags || []).includes(c.tag));
    const dark = i % 2 === 1;
    return `<section class="section${dark ? ' dark' : ''}" id="${c.id}">
      <div class="wrap-wide">
        <div class="split" style="align-items:end;margin-bottom:34px">
          <div>
            <p class="eyebrow ar" style="font-family:var(--arabic);letter-spacing:0;font-size:17px;direction:rtl">${c.ar}</p>
            <h2 class="d2">${c.name}</h2>
          </div>
          <p class="lede" style="margin:0">${c.blurb}</p>
        </div>
        <div class="grid grid-4">${items.map(p => card(p)).join('')}</div>
      </div>
    </section>`;
  }).join('');

  OD.paint();
  if (location.hash) {
    const el = document.querySelector(location.hash);
    if (el) el.scrollIntoView();
  }
};
</script>
<script src="assets/js/app.js?v=20261012e"></script>
</body>
</html>
